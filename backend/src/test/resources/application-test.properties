spring.application.name=losmatus-backend-test

# Base de datos de pruebas MySQL 8 independiente
spring.datasource.url=${TEST_DB_URL:jdbc:mysql://127.0.0.1:3306/losmatus_test_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${TEST_DB_USER:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Security
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# CORS
cors.allowed-origins=http://localhost:3000
