spring.application.name=losmatus-backend-test

# Base de datos de pruebas PostgreSQL independiente
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/losmatus_test_db}
spring.datasource.username=${TEST_DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Security
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# CORS
cors.allowed-origins=http://localhost:3000
